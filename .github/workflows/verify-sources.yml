name: Verify imagery sources

on:
  push:
    branches: [tools/verify-sources]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-tile-sources.mjs
