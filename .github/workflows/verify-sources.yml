name: Verify imagery sources

on:
  push:
    branches: [tools/verify-sources]
    paths: [scripts/verify-tile-sources.mjs, scripts/fetch-landmark-coords.mjs, .github/workflows/verify-sources.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-tile-sources.mjs | tee docs/research/imagery-sources-probe.txt
      - run: node scripts/fetch-landmark-coords.mjs | tee docs/research/landmark-coords.txt
      - name: Commit probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/research/imagery-sources-probe.txt docs/research/landmark-coords.txt
          git commit -m "chore: imagery source probe report [skip ci]" || echo "no change"
          git push
