name: Fetch test imagery tiles

on:
  push:
    branches: [tools/tile-cache]
    paths: [scripts/tiles-wanted.txt, scripts/fetch-tiles.mjs, .github/workflows/fetch-tiles.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-tiles.mjs | tee tiles-fetch-report.txt
      - name: Commit tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tiles-cache tiles-fetch-report.txt
          git commit -q -m "chore: test imagery tile cache [skip ci]" || echo "no change"
          git push
