name: Probe imagery layers 2
on:
  push:
    branches: [tools/tile-cache]
    paths: [scripts/probe2.mjs, .github/workflows/probe2.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe2.mjs > probe2-report.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe2-report.txt && git commit -q -m "chore: probe2 report [skip ci]" && git push
